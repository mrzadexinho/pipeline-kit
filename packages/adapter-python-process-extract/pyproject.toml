[project]
name = "pkit-process-extract"
version = "0.1.0"
requires-python = ">=3.12"
description = "Pipeline-kit Python adapter mirroring process-extract TS: LLM-powered structured data extraction with Pydantic schemas"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "anyio>=4.0",
  "pydantic>=2.13.4",
  "opentelemetry-api>=1.0",
  "opentelemetry-sdk>=1.0",
]

[project.urls]
Homepage = "https://github.com/mrzadexinho/pipeline-kit"
Repository = "https://github.com/mrzadexinho/pipeline-kit"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
google = ["google-generativeai>=0.8.0"]
all = ["pkit-process-extract[anthropic,openai,google]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkit_process_extract"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "ruff>=0.11.0",
]
