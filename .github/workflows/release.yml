name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm via OIDC
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -euo pipefail
          for pkg_dir in packages/*/; do
            if [ ! -f "${pkg_dir}package.json" ]; then continue; fi
            PKG_NAME=$(node -p "require('./${pkg_dir}package.json').name")
            PKG_VERSION=$(node -p "require('./${pkg_dir}package.json').version")
            PKG_PRIVATE=$(node -p "require('./${pkg_dir}package.json').private || false")
            if [ "${PKG_PRIVATE}" = "true" ]; then
              echo "${PKG_NAME} is private, skipping"
              continue
            fi
            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "${PKG_NAME}@${PKG_VERSION} already on npm, skipping"
            else
              (cd "${pkg_dir}" && npm publish --access public --provenance)
            fi
          done
        env:
          NPM_CONFIG_PROVENANCE: true

  publish-python:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Build sdist + wheel
        run: uv build
        working-directory: packages/adapter-python-process
      - name: Publish to PyPI with PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: packages/adapter-python-process/dist
          attestations: true
          skip-existing: true
