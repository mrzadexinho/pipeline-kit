name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.33.4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm via OIDC
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -euo pipefail
          for pkg_dir in packages/*/; do
            if [ ! -f "${pkg_dir}package.json" ]; then continue; fi
            PKG_NAME=$(node -p "require('./${pkg_dir}package.json').name")
            PKG_VERSION=$(node -p "require('./${pkg_dir}package.json').version")
            PKG_PRIVATE=$(node -p "require('./${pkg_dir}package.json').private || false")
            if [ "${PKG_PRIVATE}" = "true" ]; then
              echo "${PKG_NAME} is private, skipping"
              continue
            fi
            if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "${PKG_NAME}@${PKG_VERSION} already on npm, skipping"
            else
              (cd "${pkg_dir}" && npm publish --access public --provenance)
            fi
          done
        env:
          NPM_CONFIG_PROVENANCE: true

  publish-python:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Build
        run: uv build
        working-directory: packages/adapter-python-process
      - name: Publish to PyPI
        run: uv publish
        working-directory: packages/adapter-python-process
