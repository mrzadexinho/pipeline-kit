name: OIDC Token Debug (manual)

on:
  workflow_dispatch:
    inputs:
      audience:
        description: 'OIDC token audience'
        required: false
        default: 'npm:registry.npmjs.org'

permissions:
  id-token: write
  contents: read

jobs:
  print-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print parsed OIDC token claims
        uses: actions/github-script@v9
        with:
          script: |
            const audience = context.payload.inputs?.audience || 'npm:registry.npmjs.org';
            const token = await core.getIDToken(audience);
            const [, payload] = token.split('.');
            const claims = JSON.parse(Buffer.from(payload, 'base64').toString('utf8'));
            core.info('==== OIDC token claims (audience: ' + audience + ') ====');
            core.info('Do NOT share this output publicly. It contains the token claims');
            core.info('but not the signature; still treat workflow_ref / repository as sensitive.');
            core.info('--------------------------------------------------------------');
            core.info(JSON.stringify(claims, null, 2));
            core.info('==============================================================');
