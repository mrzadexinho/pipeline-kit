version: 2
updates:
  # JS — pnpm workspace (npm ecosystem auto-detects pnpm-lock.yaml at root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      js-dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      js-prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      # Major bumps stay un-grouped so each lands in isolation for review
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: ["dependencies", "javascript"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions-all:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "github-actions"]

  # Python — pkit-process (uv ecosystem, has uv.lock)
  - package-ecosystem: uv
    directory: /packages/adapter-python-process
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      python-prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps-py)"
    labels: ["dependencies", "python"]
